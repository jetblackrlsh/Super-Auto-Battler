    <text x="232" y="156" fill="#ffffff" stroke="#121636" stroke-width="5" paint-order="stroke" font-family="Impact, Arial Black, sans-serif" font-size="62" letter-spacing="1">MUTAGEN WAR</text>
    <text x="66" y="203" fill="#ffe95f" font-family="Arial Black, sans-serif" font-size="24" letter-spacing="5">SUPERHERO AUTO BATTLER</text>
  </g>
