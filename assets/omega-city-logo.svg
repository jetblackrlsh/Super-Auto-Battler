<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" role="img" aria-labelledby="title desc">
  <title id="title">Omega City Mutagen War</title>
  <desc id="desc">Stylized transparent superhero game logo.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff45c"/>
      <stop offset="0.36" stop-color="#29e7ff"/>
      <stop offset="0.7" stop-color="#ff3f9c"/>
      <stop offset="1" stop-color="#79ff57"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
